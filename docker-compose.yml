services:
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET=super_secret_key

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8001:8000"
    depends_on:
      - inventory-service
      - payment-service
      - shipping-service
    environment:
      - JWT_SECRET=super_secret_key

  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    ports:
      - "8002:8000"

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "8003:8000"

  shipping-service:
    build: ./shipping-service
    container_name: shipping-service
    ports:
      - "8004:8000"
